# ============================================================================
# RecipeHub Nginx Reverse Proxy Configuration (AWS EC2 / Fullstack Deployment)
# Điều hướng:
#   - /api/, /health/ -> ASP.NET Core Backend Container (127.0.0.1:8080)
#   - /               -> Next.js Frontend Container (127.0.0.1:3000)
# ============================================================================

upstream recipehub_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream recipehub_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    # Backend API & Health Check endpoints
    location ~ ^/(api|health)/ {
        proxy_pass http://recipehub_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next.js Frontend App Router
    location / {
        proxy_pass http://recipehub_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
