# ============================================================================
# RecipeHub Nginx Reverse Proxy Configuration (AWS EC2 / Fullstack Deployment)
# Điều hướng:
#   - /api/, /health/ -> ASP.NET Core Backend Container (recipehub-api:8080)
#   - /               -> Next.js Frontend Container (recipehub-frontend:3000)
# ============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream recipehub_backend {
    server recipehub-api:8080;
    keepalive 32;
}

upstream recipehub_frontend {
    server recipehub-frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10M;

    # Restrict DB-backed readiness check to loopback and private Docker/VPC networks
    location = /health/ready {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://recipehub_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API & Liveness endpoints
    location ~ ^/(api|health)/ {
        proxy_pass http://recipehub_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next.js Frontend App Router (preserves HTTP/1.1 keepalive when not upgrading)
    location / {
        proxy_pass http://recipehub_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# NOTE FOR PRODUCTION HTTPS (required so Secure auth cookies work in browsers):
# Terminate TLS either at AWS ALB (ACM) forwarding to port 80 with X-Forwarded-Proto: https,
# or mount Let's Encrypt certs into /etc/letsencrypt and add a `listen 443 ssl http2;` server block.
